# Token Usage: shows per-pane agent token totals as a `$tokens` sidebar token.
# [[startup]] runs once after session restore (and again on live handoff); the
# start command is idempotent and self-detaches the poller (see lifecycle/daemon.py).
id = "local.token-usage"
name = "Token Usage"
version = "0.2.0"
min_herdr_version = "0.8.2"
platforms = ["linux", "macos", "windows"]  # items below are scoped per platform
description = "Per-pane Claude token totals published as a $tokens sidebar token."


# GitHub installs run [[build]] once: it configures the sidebar (backup first, never fails the install).
# `plugin link` does not run it; see README.
[[build]]
platforms = ["linux", "macos"]
command = ["python3", "-B", "src/main.py", "sidebar-patch", "--install"]

[[build]]
platforms = ["windows"]
command = ["py", "-3", "-X", "utf8", "-B", "src/main.py", "sidebar-patch", "--install"]

[[startup]]
platforms = ["linux", "macos"]
command = ["python3", "-B", "src/main.py", "start"]

[[startup]]
platforms = ["windows"]
command = ["py", "-3", "-X", "utf8", "-B", "src/main.py", "start"]

[[actions]]
id = "start"
title = "Token Usage: start"
platforms = ["linux", "macos"]
command = ["python3", "-B", "src/main.py", "start"]

[[actions]]
id = "stop"
title = "Token Usage: stop"
platforms = ["linux", "macos"]
command = ["python3", "-B", "src/main.py", "stop"]

[[actions]]
id = "status"
title = "Token Usage: status"
platforms = ["linux", "macos"]
command = ["python3", "-B", "src/main.py", "status"]

[[actions]]
id = "start-windows"
title = "Token Usage: start (Windows)"
platforms = ["windows"]
command = ["py", "-3", "-X", "utf8", "-B", "src/main.py", "start"]

[[actions]]
id = "stop-windows"
title = "Token Usage: stop (Windows)"
platforms = ["windows"]
command = ["py", "-3", "-X", "utf8", "-B", "src/main.py", "stop"]

[[actions]]
id = "status-windows"
title = "Token Usage: status (Windows)"
platforms = ["windows"]
command = ["py", "-3", "-X", "utf8", "-B", "src/main.py", "status"]

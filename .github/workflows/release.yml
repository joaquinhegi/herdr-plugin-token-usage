name: release

# Manual release: bump `version` in herdr-plugin.toml through a PR first, then run
# this workflow from main with the same version. It tests on every platform, tags
# vX.Y.Z, moves the `latest` tag and publishes a GitHub Release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v prefix (must match herdr-plugin.toml), e.g. 0.2.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: check version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Validate version, branch and tag
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
        run: |
          python - <<'EOF'
          import os, re, sys, tomllib
          version, ref = os.environ["VERSION"], os.environ["REF"]
          if ref != "refs/heads/main":
              sys.exit(f"releases must run from main, not {ref}")
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              sys.exit(f"version must look like 1.2.3, got {version!r}")
          with open("herdr-plugin.toml", "rb") as f:
              manifest = tomllib.load(f)["version"]
          if manifest != version:
              sys.exit(f"herdr-plugin.toml has version {manifest}; bump it in a PR first")
          EOF
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "tag v$VERSION already exists" >&2
            exit 1
          fi

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -B -m unittest discover -v

  release:
    name: tag and publish
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag vX.Y.Z and move latest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "refs/tags/v$VERSION"
          git tag -f -a latest -m "latest release: v$VERSION"
          git push -f origin refs/tags/latest
      - name: Publish GitHub Release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --title "v$VERSION" --generate-notes --verify-tag --latest
